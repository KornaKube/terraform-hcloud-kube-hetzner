name: Trusted HCloud Smoke

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full commit SHA already merged into the repository default branch"
        required: true
        type: string

permissions:
  contents: read

jobs:
  hcloud-smoke:
    runs-on: ubuntu-latest
    name: HCloud plan smoke
    environment: hcloud-smoke
    timeout-minutes: 60
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and checkout merged candidate
        env:
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::trusted smoke must be dispatched from the repository default branch."
            exit 1
          fi
          if [[ ! "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full lowercase 40-character SHA."
            exit 1
          fi
          trusted_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          git rev-parse --verify "$trusted_ref^{commit}" >/dev/null
          git rev-parse --verify "$CANDIDATE_COMMIT^{commit}" >/dev/null
          if ! git merge-base --is-ancestor "$CANDIDATE_COMMIT" "$trusted_ref"; then
            echo "::error::candidate commit is not contained in origin/$DEFAULT_BRANCH."
            exit 1
          fi
          git -c advice.detachedHead=false checkout --detach "$CANDIDATE_COMMIT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false

      - name: Install HCloud CLI
        run: |
          sudo apt-get update
          sudo apt-get install --yes hcloud-cli
          hcloud version

      - name: Run token-backed negative contract tests
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN || secrets.TF_VAR_HCLOUD_TOKEN }}
        run: |
          if [ -z "${HCLOUD_TOKEN:-}" ]; then
            echo "::error::HCLOUD_TOKEN or TF_VAR_HCLOUD_TOKEN secret is required for trusted smoke."
            exit 1
          fi
          if [ "${#HCLOUD_TOKEN}" -ne 64 ]; then
            echo "::error::HCLOUD_TOKEN must be a 64-character HCloud token."
            exit 1
          fi
          python3 scripts/contract_negative_tests.py

      - name: Run selected positive smoke matrix
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN || secrets.TF_VAR_HCLOUD_TOKEN }}
        run: |
          python3 scripts/smoke_v3_plan_matrix.py \
            --filter cilium-dualstack-static-valid \
            --filter cilium-dualstack-rke2-static-valid \
            --filter cilium-dualstack-dormant-pools-valid \
            --filter rke2-testing-amd64-valid \
            --filter rke2-testing-arm64-invalid \
            --filter rke2-testing-dormant-arm64-autoscaler-valid \
            --filter public-join-private-control-plane-invalid \
            --filter nat-router-private-only-valid \
            --filter embedded-registry-k3s-valid

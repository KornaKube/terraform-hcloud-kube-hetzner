---
name: Publish a new Github Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  Release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Extract reviewed changelog
        run: |
          set -euo pipefail
          test -f CHANGELOG.md
          test "$(grep -Ec '^## \[Unreleased\]$' CHANGELOG.md)" -eq 1
          awk '/^## \[Unreleased\]$/{found=1; next} /^## \[/{exit} found' \
            CHANGELOG.md > changelog_section.md
          grep -Eq '[^[:space:]]' changelog_section.md

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          generateReleaseNotes: true
          name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: changelog_section.md
